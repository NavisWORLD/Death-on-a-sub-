name: HEARTLIGHT Home Downloads

on:
  push:
    branches: [main]
    paths:
      - "src/heartlight/**"
      - "packaging/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/home-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e ".[dev,home]" pyinstaller
      - name: Verify Home workflow
        run: python -m pytest -q tests/test_home.py
      - name: Build portable Windows app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name HEARTLIGHT-Home packaging/heartlight_home_launcher.py
      - name: Rename Windows asset
        shell: pwsh
        run: Move-Item dist/HEARTLIGHT-Home.exe HEARTLIGHT-Home-Windows.exe
      - uses: actions/upload-artifact@v4
        with:
          name: HEARTLIGHT-Home-Windows
          path: HEARTLIGHT-Home-Windows.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e '.[dev,home]' pyinstaller
      - name: Verify Home workflow
        run: python -m pytest -q tests/test_home.py
      - name: Build macOS app bundle
        run: pyinstaller --noconfirm --clean --windowed --name HEARTLIGHT-Home packaging/heartlight_home_launcher.py
      - name: Archive macOS app
        run: ditto -c -k --sequesterRsrc --keepParent dist/HEARTLIGHT-Home.app HEARTLIGHT-Home-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: HEARTLIGHT-Home-macOS
          path: HEARTLIGHT-Home-macOS.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -e '.[dev,home]' pyinstaller
      - name: Verify Home workflow
        run: python -m pytest -q tests/test_home.py
      - name: Build Linux binary
        run: pyinstaller --noconfirm --clean --onefile --name HEARTLIGHT-Home packaging/heartlight_home_launcher.py
      - name: Archive Linux binary
        run: tar -C dist -czf HEARTLIGHT-Home-Linux-x86_64.tar.gz HEARTLIGHT-Home
      - uses: actions/upload-artifact@v4
        with:
          name: HEARTLIGHT-Home-Linux
          path: HEARTLIGHT-Home-Linux-x86_64.tar.gz

  publish-latest:
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish moving Home release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete home-latest --cleanup-tag -y || true
          git tag -f home-latest "$GITHUB_SHA"
          git push origin refs/tags/home-latest --force
          gh release create home-latest release-assets/* \
            --title "HEARTLIGHT Home — Latest" \
            --prerelease \
            --notes "Family-friendly desktop build of HEARTLIGHT Home. Download the file for your operating system and open it; no Python or terminal is required. Windows and macOS binaries are currently unsigned community builds, so the operating system may show a security warning. HEARTLIGHT is a memorial archive/simulation toolkit and does not claim resurrection or identity transfer."
