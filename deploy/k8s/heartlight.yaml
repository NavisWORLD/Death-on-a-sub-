apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: heartlight-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartlight-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: heartlight-api
  template:
    metadata:
      labels:
        app: heartlight-api
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/REPLACE_ME/heartlight:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: HEARTLIGHT_DATA_ROOT
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: heartlight-data
---
apiVersion: v1
kind: Service
metadata:
  name: heartlight-api
spec:
  type: ClusterIP
  selector:
    app: heartlight-api
  ports:
    - port: 80
      targetPort: 8080
