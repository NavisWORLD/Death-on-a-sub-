[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heartlight-lantern"
version = "0.2.0"
description = "Consent-first memorial archive, heartbeat rhythm toolkit, and family-friendly HEARTLIGHT Home app"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "HEARTLIGHT contributors"}]
dependencies = []
keywords = ["digital-memorial", "family-archive", "provenance", "heartbeat", "azure", "ibm-cloud"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.20"]
ibm = ["ibm-cos-sdk>=2.13"]
cloud = ["azure-storage-blob>=12.20", "ibm-cos-sdk>=2.13"]
server = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.12"]
home = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.12"]
enterprise = [
  "azure-storage-blob>=12.20",
  "ibm-cos-sdk>=2.13",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.12",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
]

[project.scripts]
heartlight = "heartlight.cli:main"
heartlight-home = "heartlight.home_app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
