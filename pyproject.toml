[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "heartlight-lantern"
version = "0.1.0"
description = "Consent-first memorial archive and heartbeat rhythm signature toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "HEARTLIGHT contributors"}]
dependencies = []
keywords = ["digital-memorial", "family-archive", "provenance", "heartbeat", "azure", "ibm-cloud"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
azure = ["azure-storage-blob>=12.20"]
ibm = ["ibm-cos-sdk>=2.13"]
cloud = ["azure-storage-blob>=12.20", "ibm-cos-sdk>=2.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
heartlight = "heartlight.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
