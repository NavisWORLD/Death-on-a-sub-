[package]
name = "heartlight-hip"
version = "0.1.0"
edition = "2021"
description = "Rust types for the HEARTLIGHT Interop Protocol"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
